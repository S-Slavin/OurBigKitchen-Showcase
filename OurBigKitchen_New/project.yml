name: OurBigKitchen
options:
  bundleIdPrefix: com.ourbigkitchen
  deploymentTarget:
    iOS: 17.0
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true

packages:
  KeychainAccess:
    url: https://github.com/kishikawakatsumi/KeychainAccess
    from: 4.2.2
  ComposableArchitecture:
    url: https://github.com/pointfreeco/swift-composable-architecture
    from: 1.8.2

targets:
  OurBigKitchen:
    type: application
    platform: iOS
    sources: 
      - path: OurBigKitchen
    settings:
      base:
        INFOPLIST_FILE: OurBigKitchen/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.ourbigkitchen.app
        DEVELOPMENT_TEAM: ""  # Add your team ID here
    dependencies:
      - package: KeychainAccess
      - package: ComposableArchitecture
    info:
      path: OurBigKitchen/Info.plist
      properties:
        UILaunchStoryboardName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleShortVersionString: 1.0.0
        CFBundleVersion: 1
        ITSAppUsesNonExemptEncryption: false

  OurBigKitchenTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: OurBigKitchen 