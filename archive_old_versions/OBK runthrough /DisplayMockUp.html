<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBK - Today's Recipients</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .phone-mockup {
            width: 375px;
            height: 812px;
            background: #fff9e6;
            border-radius: 40px;
            padding: 0;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
        }

        .content {
            padding: 40px 30px;
            text-align: center;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo {
            margin-top: 40px;
            width: 100px;
            height: 100px;
            background: rgba(255, 153, 77, 0.1);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid #ff994d;
            margin-bottom: 40px;
        }

        .logo-text {
            font-size: 40px;
            font-weight: bold;
            color: #ff994d;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 0;
        }

        .icon {
            font-size: 80px;
            margin-bottom: 24px;
        }

        .main-title {
            font-size: 36px;
            font-weight: bold;
            color: #ff994d;
            margin-bottom: 24px;
            line-height: 1.3;
        }

        .description {
            font-size: 18px;
            color: #ff994d;
            line-height: 1.6;
            max-width: 280px;
        }

        .bottom-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: white;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid rgba(0,0,0,0.1);
        }

        .nav-item {
            color: #ff994d;
            font-size: 16px;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="phone-mockup">
        <div class="content">
            <div class="logo">
                <div class="logo-text">OBK</div>
            </div>

            <div class="main-content">
                <div class="icon">👥</div>
                <h1 class="main-title">Today's Recipients</h1>
                <p class="description">
                    See who needs your help today. Your meals make a real difference in their lives.
                </p>
            </div>

            <div class="bottom-bar">
                <a href="#" class="nav-item">Home</a>
                <a href="#" class="nav-item">Recipients</a>
                <a href="#" class="nav-item">Profile</a>
            </div>
        </div>
    </div>
</body>
</html>
